name: Feature or feedback
description: Share a driver need, coaching question or improvement idea.
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: "Public report: include no personal paths, private recordings or game assets."
  - type: input
    id: version
    attributes:
      label: App version and operating system
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to understand or achieve?
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What would help, and why?
    validations:
      required: true
