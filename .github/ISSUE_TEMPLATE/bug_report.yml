name: Bug report
description: Report a reproducible problem in the public alpha.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "This is public. Include no personal paths, usernames, private recordings or game assets."
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: input
    id: stage
    attributes:
      label: Stage (if relevant)
  - type: input
    id: car
    attributes:
      label: Car (if relevant)
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce, expected and actual result
      description: Describe what you did and what happened. Remove personal paths from any error text.
    validations:
      required: true
